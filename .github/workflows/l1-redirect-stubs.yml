# /AllusionistWiki/l1/* 転送スタブ再生成（GitHub Actions）
#
# 旧 v1 の L1 下位層 URL（/AllusionistWiki/l1/<path>/）を现行サイト
# /AllusionistWiki2/L1/ へ meta refresh する 1 ページのスタブを、
# vault（AllusionistLLMWiki2_Obsidian wiki/**/*.md）対応パス分だけ生成する。
name: l1-redirect-stubs
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Clone vault
        run: git clone --depth 1 https://github.com/allusionistwiki/AllusionistLLMWiki2_Obsidian.git .vault-tmp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stubs (meta refresh placeholders in public/l1)
        run: |
          python3 scripts/gen_l1_redirects.py .vault-tmp/wiki/l1/l1 public/l1
          find public/l1 -name '*.html' | wc -l
      - name: Commit and push
        run: |
          git config user.name "allusionistwiki-bot"
          git config user.email "allusionist.wiki@gmail.com"
          git add -f public/l1
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "regenerate l1 redirect stubs ($(ls content/l1 | wc -l) pages)"
            git push origin HEAD:main
          fi
