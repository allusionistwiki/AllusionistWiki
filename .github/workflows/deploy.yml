name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [main]
  # Obsidian vault 側の変更で再デプロイ（vault の main がpushされたら発火）
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:
  # vault リポジトリの最新を定期取得してビルド（変更なし時はスキップ）
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.flag.outputs.deploy }}
      vault_sha: ${{ steps.vault.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      # vault の最新SHAを取得し、デプロイ済みか確認（変更なしならスキップ）
      - name: Get vault HEAD SHA
        id: vault
        run: |
          sha=$(git ls-remote https://github.com/allusionistwiki/AllusionistWiki_obsidian.git refs/heads/main | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check if this vault SHA was already deployed
        id: cached
        uses: actions/cache/restore@v4
        with:
          path: .deploy-marker
          # v5: サイト側コミット SHA をキーに追加。quartz コード/ワークフロー変更時
          # （vault 不変）にビルドがスキップされサイトが旧版のまま固着する穴を塞ぐ。
          # v4: L1 層は AllusionistWiki2 独立サイトへ移設（本サイトは v1 vault SHA のみ）。
          # v3: L1 層 SHA をキーに追加（L1 更新が vault 不変でスキップされる穴を塞ぐ）。
          # v2: 旧マーカー（deployed-<sha>）を無効化。バグで誤記録された
          # 「デプロイ済み」マーカーを跨いで必ず1回再ビルドさせる。
          key: deployed-v5-${{ steps.vault.outputs.sha }}-${{ github.sha }}

      - name: Set deploy flag
        id: flag
        run: |
          if [ "${{ steps.cached.outputs.cache-hit }}" = "true" ]; then
            echo "vault unchanged (sha ${{ steps.vault.outputs.sha }}), skipping build"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch wiki content from Obsidian vault repo
        if: steps.flag.outputs.deploy == 'true'
        run: |
          git clone --depth 1 https://github.com/allusionistwiki/AllusionistWiki_obsidian.git /tmp/vault
          mkdir -p content
          cp -r /tmp/vault/wiki/. content/

      # L1 層は AllusionistWiki2 独立サイトへ移設済み。
      # 旧 /AllusionistWiki/l1/* URL は meta refresh スタブで新サイトへ転送（外部被リンク保全）
      - name: Generate L1 redirect stubs (moved to AllusionistWiki2)
        if: steps.flag.outputs.deploy == 'true'
        run: |
          git clone --depth 1 https://github.com/allusionistwiki/AllusionistLLMWiki2_Obsidian.git /tmp/l1
          python3 scripts/gen_l1_redirects.py

      # 増分ビルド用キャッシュ（transpile ワーカー等）。restore 出来れば再トランスパイルを省略
      - name: Restore Quartz build cache
        if: steps.flag.outputs.deploy == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .quartz-cache
          key: quartz-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            quartz-cache-${{ runner.os }}-

      - name: Generate recent-commits page (GitHub API)
        if: steps.flag.outputs.deploy == 'true'
        run: |
          python3 scripts/fetch_recent_commits.py 100

      - uses: actions/setup-node@v4
        if: steps.flag.outputs.deploy == 'true'
        with:
          node-version: 22

      # node_modules キャッシュ（lock 不変なら npm ci を丸ごとスキップ）
      - name: Restore node_modules cache
        if: steps.flag.outputs.deploy == 'true'
        id: npmcache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        if: steps.flag.outputs.deploy == 'true' && steps.npmcache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build Quartz
        if: steps.flag.outputs.deploy == 'true'
        run: npx quartz build

      - name: Save Quartz build cache
        if: steps.flag.outputs.deploy == 'true'
        uses: actions/cache/save@v4
        with:
          path: .quartz-cache
          key: quartz-cache-save-${{ runner.os }}-${{ github.sha }}

      - name: Upload artifact
        if: steps.flag.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # デプロイ成功後にのみvault SHAを記録（失敗時は次回再試行される）
      # ★build が実際に取得・ビルドした SHA をそのまま使うこと。
      #   ここで ls-remote を再実行すると、ビルド後に vault へ入った新規コミットの
      #   SHA を「デプロイ済み」と誤記録し、以後の定期実行が全部スキップされて
      #   サイトが古いまま固着する（2026-10-03 の /AllusionistWiki プレフィックス
      #   欠落リンク事故の原因）。
      - name: Mark vault SHA as deployed
        run: |
          mkdir -p .deploy-marker
          echo "deployed" > .deploy-marker/deployed.txt

      - name: Save deploy marker
        uses: actions/cache/save@v4
        with:
          path: .deploy-marker
          key: deployed-v5-${{ needs.build.outputs.vault_sha }}-${{ github.sha }}
